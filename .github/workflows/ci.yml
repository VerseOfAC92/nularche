name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - name: Site pages are in sync with PRIVACY.md and screenshots
        run: node scripts/build-site.ts --check
      - run: npm test
      - name: Core tests on the web platform layer (in-memory files, browser crypto)
        run: npm run test:web-platform
      - name: Core builds for the browser without Node modules
        run: npm run check:web-platform
      - run: npm run mcp:smoke
      - run: npm run build
      - run: node scripts/build-desktop.ts
