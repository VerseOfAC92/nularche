name: Release

# Builds every installer on its own operating system, installs it the way a user would and runs the
# packaged-app smoke test (scripts/smoke-packaged.ts). A `v*` tag publishes the tested installers as a
# GitHub Release; "Run workflow" (workflow_dispatch) builds and tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - run: node scripts/dist-mac.ts
      - name: Install from the Apple Silicon DMG and smoke test
        run: |
          set -e
          dmg=$(ls release/Nularche-macOS-AppleSilicon.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -n1 | awk -F'\t' '{print $NF}')
          ditto "$mnt/Nularche.app" "$RUNNER_TEMP/AppleSilicon/Nularche.app"
          hdiutil detach "$mnt" -quiet
          file "$RUNNER_TEMP/AppleSilicon/Nularche.app/Contents/MacOS/Nularche"
          node scripts/smoke-packaged.ts "$RUNNER_TEMP/AppleSilicon/Nularche.app/Contents/MacOS/Nularche"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: release/*.dmg

  # The Intel DMG built above is tested natively on an Intel Mac (Electron under Rosetta does not start on the
  # virtualised Apple Silicon runners, although it works under Rosetta on real Macs).
  macos-intel:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: release
      - name: Install from the Intel DMG and smoke test
        run: |
          set -e
          uname -m
          dmg=$(ls release/Nularche-macOS-Intel.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -n1 | awk -F'\t' '{print $NF}')
          ditto "$mnt/Nularche.app" "$RUNNER_TEMP/Intel/Nularche.app"
          hdiutil detach "$mnt" -quiet
          file "$RUNNER_TEMP/Intel/Nularche.app/Contents/MacOS/Nularche"
          node scripts/smoke-packaged.ts "$RUNNER_TEMP/Intel/Nularche.app/Contents/MacOS/Nularche"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - run: node scripts/dist-win.ts
      - name: Install each installer silently and smoke test (x64, x86)
        shell: pwsh
        run: |
          foreach ($a in "x64", "x86") {
            $setup = Get-ChildItem "release\Nularche-Windows-$a-Setup.exe" | Select-Object -First 1
            $dir = Join-Path $env:RUNNER_TEMP "nularche-$a"
            Write-Host "== Windows ${a}: $($setup.Name) =="
            Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
            if (-not (Test-Path "$dir\Nularche.exe")) { throw "Installer did not create $dir\Nularche.exe" }
            node scripts/smoke-packaged.ts "$dir\Nularche.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: release/*-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - name: Install the .deb with apt and smoke test
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y ./release/Nularche-Linux-amd64.deb
          which nularche
          xvfb-run -a node scripts/smoke-packaged.ts /opt/Nularche/nularche
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: release/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, macos-intel, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          cat > first.md <<'MD'
          ### First launch (one time)
          Nularche is free and open source, and not yet signed with paid Apple or Microsoft certificates:
          - **macOS (easiest):** paste into Terminal: `curl -fsSL https://raw.githubusercontent.com/VerseOfAC92/nularche/main/scripts/install/install.sh | bash`
            No security prompt. If you install the DMG instead and see **"Nularche.app" Not Opened**, click **Done**, then
            right away open **System Settings → Privacy & Security** (Security section) and click **Open Anyway** (once; it only appears briefly after the warning). The DMG window and its *READ ME FIRST* file show the same steps.
          - **Windows:** if SmartScreen says *Windows protected your PC*, click **More info → Run anyway**.
          - **Linux:** `sudo apt install ./Nularche-Linux-amd64.deb`. No extra step.

          MD
          cat first.md notes.md > notes2.md && mv notes2.md notes.md
          cat >> notes.md <<'MD'

          ### Downloads
          | System | File |
          | --- | --- |
          | macOS, Apple Silicon (M1–M5) | `Nularche-macOS-AppleSilicon.dmg` |
          | macOS, Intel | `Nularche-macOS-Intel.dmg` |
          | Windows, 64-bit | `Nularche-Windows-x64-Setup.exe` |
          | Windows, 32-bit | `Nularche-Windows-x86-Setup.exe` |
          | Linux (Debian/Ubuntu, amd64) | `Nularche-Linux-amd64.deb` |

          Every installer above was installed and smoke-tested on its own operating system by this workflow.
          MD
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nularche ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-published tag: replace every asset with the newly built and tested installers.
            gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | while read -r name; do
              gh release delete-asset "$GITHUB_REF_NAME" "$name" -y
            done
            gh release upload "$GITHUB_REF_NAME" dist/*
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi
