name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The behaviour you see and the behaviour you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: Nularche version
      placeholder: "3.0.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux, Web (browser)]
  - type: markdown
    attributes:
      value: "Please don't share the content of your personal notes; if needed, make a small example Node."
