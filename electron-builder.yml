# Nularche packaging (RFC-001 §3: namespace specification)
appId: io.nularche.app
productName: Nularche
copyright: Copyright © 2026 VerseOfAC92
directories:
  output: release
  buildResources: build
# The Node side is bundled with esbuild, so node_modules isn't needed.
files:
  - package.json
  - dist-desktop/main.cjs
extraResources:
  - from: dist-desktop/preload.cjs
    to: preload.cjs
  - from: dist-desktop/mcp.mjs
    to: mcp.mjs
  - from: packages/web/dist
    to: web
asar: true
artifactName: Nularche-${version}-${os}-${arch}.${ext}
protocols:
  - name: Nularche
    schemes: [nularche]
fileAssociations:
  - ext: nlc
    name: Nularche Container
    description: Nularche Node paketi
    mimeType: application/vnd.nularche.document
    role: Editor
    icon: build/icon.png
  - ext: nla
    name: Nularche Archive
    description: Nularche archive / template pack
    mimeType: application/vnd.nularche.archive
    role: Editor
    icon: build/icon.png
electronFuses:
  # Claude starts the MCP server with the app's binary and ELECTRON_RUN_AS_NODE=1.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  # The audio recording block uses the microphone only when the user presses "Start recording".
  extendInfo:
    NSMicrophoneUsageDescription: Nularche uses the microphone only when you record an audio note. / Nularche mikrofonu yalnızca sesli not kaydederken kullanır.
  # Ad-hoc signature without an Apple Developer identity (needed to run on Apple Silicon).
  identity: "-"
  hardenedRuntime: false
  # Apple Silicon and Intel packages are built separately by scripts/dist-mac.ts so their names don't clash.
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  title: Nularche ${version}
  # Drag-and-drop arrow in the window and the macOS 15+ first-launch step (made by scripts/dmg-background.swift).
  background: build/dmg/background.png
  window:
    width: 660
    height: 460
  iconSize: 96
  contents:
    - x: 170
      y: 175
      type: file
    - x: 490
      y: 175
      type: link
      path: /Applications
    - x: 600
      y: 60
      type: file
      path: build/dmg/READ ME FIRST.txt
win:
  icon: build/icon.png
  # 64- and 32-bit installers are built separately by scripts/dist-win.ts (x64 / x86 in their names).
  target:
    - target: nsis
      arch: [x64, ia32]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Nularche
linux:
  icon: build/icon.png
  category: Office
  executableName: nularche
  maintainer: VerseOfAC92 <noreply@github.com>
  synopsis: Local-first, AI-native notes, databases and templates in plain Markdown
  description: Nularche keeps your notes as plain Markdown files on your own computer, with Notion-style databases, templates, publishing and an AI assistant.
  desktop:
    entry:
      StartupWMClass: Nularche
  target:
    - target: deb
      arch: [x64]
deb:
  artifactName: Nularche-Linux-amd64.${ext}
  packageName: nularche
