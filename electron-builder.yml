# Nularche paketleme (RFC-001 §3: isim alanı spesifikasyonu)
appId: io.nularche.app
productName: Nularche
copyright: Copyright © 2026 VerseOfAC92
directories:
  output: release
  buildResources: build
# Node tarafı esbuild ile paketlendiği için node_modules gerekmez.
files:
  - package.json
  - dist-desktop/main.cjs
extraResources:
  - from: dist-desktop/preload.cjs
    to: preload.cjs
  - from: dist-desktop/mcp.mjs
    to: mcp.mjs
  - from: packages/web/dist
    to: web
asar: true
artifactName: Nularche-${version}-${os}-${arch}.${ext}
protocols:
  - name: Nularche
    schemes: [nularche]
fileAssociations:
  - ext: nlc
    name: Nularche Container
    description: Nularche Node paketi
    mimeType: application/vnd.nularche.document
    role: Editor
    icon: build/icon.png
  - ext: nla
    name: Nularche Archive
    description: Nularche arşivi / şablon paketi
    mimeType: application/vnd.nularche.archive
    role: Editor
    icon: build/icon.png
electronFuses:
  # MCP sunucusu Claude tarafından uygulamanın ikilisiyle ELECTRON_RUN_AS_NODE=1 olarak başlatılır.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  # Ses kaydı bloğu mikrofonu yalnızca kullanıcı "Kaydı başlat"a bastığında kullanır.
  extendInfo:
    NSMicrophoneUsageDescription: Nularche uses the microphone only when you record an audio note. / Nularche mikrofonu yalnızca sesli not kaydederken kullanır.
  # Apple Developer kimliği olmadan ad-hoc imza (Apple Silicon'da çalışması için gerekli).
  identity: "-"
  hardenedRuntime: false
  # Apple Silicon ve Intel paketleri, adları karışmasın diye scripts/dist-mac.ts ile ayrı ayrı derlenir.
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  title: Nularche ${version}
  # Pencerede sürükle-bırak oku ve macOS 15+ ilk açılış adımı (scripts/dmg-background.swift ile üretilir).
  background: build/dmg/background.png
  window:
    width: 660
    height: 460
  iconSize: 96
  contents:
    - x: 170
      y: 175
      type: file
    - x: 490
      y: 175
      type: link
      path: /Applications
    - x: 600
      y: 60
      type: file
      path: build/dmg/READ ME FIRST.txt
win:
  icon: build/icon.png
  # 64 ve 32 bit kurulum dosyaları scripts/dist-win.ts ile ayrı ayrı (adlarında x64 / x86) derlenir.
  target:
    - target: nsis
      arch: [x64, ia32]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Nularche
linux:
  icon: build/icon.png
  category: Office
  executableName: nularche
  maintainer: VerseOfAC92 <noreply@github.com>
  synopsis: Local-first, AI-native notes, databases and templates in plain Markdown
  description: Nularche keeps your notes as plain Markdown files on your own computer, with Notion-style databases, templates, publishing and an AI assistant.
  desktop:
    entry:
      StartupWMClass: Nularche
  target:
    - target: deb
      arch: [x64]
deb:
  artifactName: Nularche-Linux-amd64.${ext}
  packageName: nularche
